file_uploads = On
post_max_size = 100M
upload_max_filesize = 32M
memory_limit = 256M
max_file_uploads = 50
max_execution_time = 60
session.use_strict_mode = 0
session.use_cookies = 1
expose_php = Off
apc.shm_size = 128M
apc.enable_cli = 1

[xdebug]
xdebug.mode = debug
xdebug.start_with_request = yes
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003